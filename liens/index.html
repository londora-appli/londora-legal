<style>
  :root {
    --bg: #0B1A11;
    --bg2: #1A3625;
    --gold: #E8B84A;
    --gold-light: #FFE29A;
    --text: #F5EEDC;
    --muted: #B9B09A;
    --card: rgba(255, 255, 255, 0.05);
    --card-border: rgba(232, 184, 74, 0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at top, var(--bg2) 0%, var(--bg) 70%) fixed, var(--bg);
    color: var(--text);
    font-family: "Montserrat", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px 32px;
  }
  main { width: 100%; max-width: 460px; text-align: center; }
  .logo {
    width: 100%;
    max-width: 140px;
    border-radius: 28%;
    border: 1px solid var(--card-border);
    box-shadow: 0 0 36px rgba(232, 184, 74, 0.3);
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  h1 {
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    letter-spacing: 0.3em;
    padding-left: 0.3em;
    background: linear-gradient(180deg, #FFF1C1 0%, #F2C55C 45%, #B8862B 70%, #F7D77F 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-top: 20px;
    font-size: 2rem;
  }
  .tagline { color: var(--muted); margin: 6px 0 28px; font-size: 0.95rem; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  a.link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 18px;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  a.link:hover, a.link:focus-visible {
    transform: translateY(-2px);
    background: rgba(232, 184, 74, 0.12);
    border-color: var(--gold);
    outline: none;
  }
  a.link.primary {
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color: #1A1405;
    border-color: transparent;
  }
  a.link svg { width: 24px; height: 24px; flex-shrink: 0; fill: currentColor; }
  a.link span { flex: 1; text-align: left; }
  a.link small { display: block; font-weight: 400; font-size: 0.8rem; opacity: 0.75; }
  footer { margin-top: 36px; color: var(--muted); font-size: 0.8rem; }
  footer a { color: var(--gold); text-decoration: none; }
</style>
