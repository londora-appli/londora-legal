<!--
  Espace assistance Londora Pro — publié sur support.londora.fr/assistance/.
  Connexion : code e-mail (Supabase Auth) + double authentification (TOTP).
  Lecture seule d'un dossier UNIQUEMENT avec le code d'accès que
  l'utilisateur a créé dans l'app (supabase/support_access.sql).
  Aucune clé secrète ici : seule la clé publique (publishable) est utilisée.
  La session n'est gardée qu'en mémoire (rien dans le navigateur).
-->
</head>
<body>
<header><div class="wrap head">
  <div><h1>Espace assistance</h1><div class="sub">Londora Pro · consultation en lecture seule</div></div>
  <div class="head-actions"><span id="who" class="who"></span><button class="btn ghost" id="logout" hidden>Se déconnecter</button></div>
</div></header>
<main class="wrap" id="app"><p class="muted">Chargement…</p></main>
<footer>Accès réservé à l'équipe d'assistance Londora. Chaque consultation est enregistrée et visible par l'utilisateur. Déconnexion automatique après 15 minutes d'inactivité.</footer>
<script src="assistance.js"></script>
</body>
